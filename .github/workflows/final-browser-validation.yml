name: Final browser validation

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character candidate commit or PR merge SHA
        required: true
        type: string
      pr_head_sha:
        description: PR head SHA when commit_sha is a PR merge SHA
        required: false
        type: string
      pr_number:
        description: PR number used to cancel an older candidate run
        required: true
        type: string
      capture_evidence:
        description: Save Chromium B1 screenshots and evidence.json
        required: true
        default: false
        type: boolean

concurrency:
  group: final-browser-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  viewport-matrix:
    name: viewport matrix (${{ matrix.engine }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - name: Validate candidate identity
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "${PR_HEAD_SHA}" || "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - id: revision
        name: Record checked-out revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify viewport matrix
        env:
          CHECKED_OUT_SHA: ${{ steps.revision.outputs.sha }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha || inputs.commit_sha }}
          VIEWPORT_EVIDENCE_DIR: ${{ inputs.capture_evidence && matrix.engine == 'chromium' && 'viewport-evidence' || '' }}
        run: npm run verify:ui -- --engine ${{ matrix.engine }} --json viewport-report-${{ matrix.engine }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-report-${{ matrix.engine }}
          path: viewport-report-${{ matrix.engine }}.json
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        if: always() && inputs.capture_evidence && matrix.engine == 'chromium'
        with:
          name: b1-ui-evidence-chromium-attempt-${{ github.run_attempt }}
          path: viewport-evidence/
          if-no-files-found: warn
          retention-days: 3

  # The hero is the first thing a visitor touches and, on a phone, the only
  # thing: the model is turned by swiping across it and a structure is named by
  # tapping it. A pointer has a hover and a finger does not, and a press that
  # goes out and comes back — how a model is turned and turned back — ends where
  # it started, which is how a rotate once came to pin a structure nobody chose.
  # None of that is reachable from `node --test`, and the viewport matrix above
  # measures surfaces at rest rather than under a finger.
  #
  # Chromium with touch emulation, for the same reason as the job below: this
  # repository keeps browsers out of ordinary PR pushes. It is not a device
  # pass — no iOS Safari, no real hardware — and says so in its own output.
  hero-touch:
    name: landing hero under a finger (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "${PR_HEAD_SHA}" || "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:hero-touch -- --shots hero-touch-shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hero-touch-shots-attempt-${{ github.run_attempt }}
          path: hero-touch-shots/
          if-no-files-found: ignore
          retention-days: 3

  # The account dialog is the one surface `npm test` structurally cannot reach:
  # `AccessManager` reads `import.meta.env` at module load, so under
  # `node --test` it is permanently "not configured" and never builds a
  # credential form at all. Three defects shipped through that gap — Enter
  # submitting nothing, the dialog losing the keyboard whenever it re-rendered,
  # and a sign-in heading over a body saying no account access exists.
  #
  # Chromium only, and here rather than in `ci.yml`, because this repository
  # deliberately keeps browsers out of ordinary PR pushes
  # (`tests/viewports.test.js` holds that line). The cost is that a credential
  # regression is caught at candidate time rather than on the PR that caused
  # it; `tests/credential-flow.test.js` covers the form's shape on every push.
  auth-flow:
    name: auth flow (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate candidate identity
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_HEAD_SHA: ${{ inputs.pr_head_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ -z "${PR_HEAD_SHA}" || "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Not secrets, and deliberately not a real project: the host does not
      # resolve and the check stubs every auth request in the browser. They
      # exist only because a build with no Supabase configured contains no
      # credential form to drive — which is the other surface the check covers.
      - name: Build with a stub account configuration
        env:
          VITE_SUPABASE_URL: https://stub.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: stub-publishable-key
        run: npm run build
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:auth
