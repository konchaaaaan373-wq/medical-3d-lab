# The three checks that had never run in CI.
#
# `verify:anatomy`, `verify:disease` and `verify:patient` appeared in no
# workflow at all until this file. They ran on somebody's machine or they did
# not run, and "did not run" is what usually happened — which is how, on
# 2026-09-16, the click tour was broken on every published scene at once with
# `npm test` entirely green and nothing red anywhere.
#
# Each of them drives the product the way a reader does and reads back what the
# product itself says, which is the class of failure `node --test` structurally
# cannot see: whether clicking a mesh selects the structure the reader is then
# told about, whether Reset returns the scene rather than only the sliders,
# whether pressing Next moves anything on screen.
#
# `workflow_dispatch` only, and deliberately so. These are minutes-per-scene
# checks — the anatomy drive is the most expensive thing this repository owns —
# and F-112 holds the standing decision about what runs per pull request
# (one engine, one check). Nothing here changes that; this is the candidate-time
# shelf, next to `final-browser-validation.yml`.
name: Scene drive validation

"on":
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character candidate commit or PR merge SHA
        required: true
        type: string
      pr_number:
        description: PR number used to cancel an older candidate run
        required: true
        type: string
      disease_scenes:
        description: Space-separated disease scene slugs to drive
        required: false
        default: copd asthma pulmonary-edema
        type: string
      patient_scene:
        description: Scene slug whose patient explanation is walked
        required: false
        default: copd
        type: string

concurrency:
  group: scene-drive-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Which scenes each drive covers is not written here.
  #
  # CLAUDE.md forbids copying the published list anywhere: it has been wrong in
  # three places at once before, and a workflow file is the worst place for a
  # copy because nothing renders it. So the set is derived from the one source
  # the UI reads, `src/catalog/publicManifest.js`, at the moment the run starts.
  # A scene that becomes published is covered by the next run without anyone
  # editing this file; one that is withheld stops being driven for the same
  # reason.
  #
  # **Published is not the same as anatomy, and for a day this file assumed it
  # was.** The whole published set went to the anatomy drive, which was right
  # for exactly as long as the beta published anatomy only. The day a mechanism
  # scene opened, that drive spent thirty seconds waiting for a part tree the
  # scene does not have and reported it as the scene failing to open (F-198).
  # The split below asks the catalogue the same question `release.js` asks —
  # `anatomyClaimProblems` — instead of assuming the answer.
  published-scenes:
    name: which scenes are published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      scenes: ${{ steps.read.outputs.scenes }}
      mechanism: ${{ steps.read.outputs.mechanism }}
    steps:
      - name: Validate candidate identity
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: read
        name: Read the published scene ids from the catalogue, and split them by what they claim
        env:
          NAMED_DISEASE_SCENES: ${{ inputs.disease_scenes }}
        run: |
          split=$(node --input-type=module -e "
            import { PUBLIC_MODELS } from './src/catalog/publicManifest.js';
            import { anatomyClaimProblems } from './src/catalog/release.js';
            import { sceneById } from './src/catalog/index.js';
            const ids = PUBLIC_MODELS.map((model) => model.sceneId);
            if (ids.length === 0) throw new Error('the public manifest publishes nothing');
            const isAnatomy = (id) => anatomyClaimProblems(sceneById(id)).length === 0;
            const anatomy = ids.filter(isAnatomy);
            // Everything published that the anatomy drive cannot drive, minus
            // whatever the caller already named. A published scene that no
            // drive covers is the failure this split exists to stop, so the
            // leftovers are handed to the disease drive rather than dropped.
            const named = new Set((process.env.NAMED_DISEASE_SCENES ?? '').split(/\s+/).filter(Boolean));
            const mechanism = ids.filter((id) => !isAnatomy(id) && !named.has(id));
            if (anatomy.length === 0) throw new Error('nothing published claims anatomy; the anatomy matrix would be empty');
            process.stdout.write(JSON.stringify({ anatomy, mechanism }));
          ")
          scenes=$(node -e "process.stdout.write(JSON.stringify(JSON.parse(process.argv[1]).anatomy))" "${split}")
          mechanism=$(node -e "process.stdout.write(JSON.parse(process.argv[1]).mechanism.join(' '))" "${split}")
          echo "scenes=${scenes}" >> "$GITHUB_OUTPUT"
          echo "mechanism=${mechanism}" >> "$GITHUB_OUTPUT"
          echo "Anatomy drive: ${scenes}"
          echo "Published, driven by the disease drive instead: ${mechanism:-none}"

  # One job per published scene. Serial inside a scene, parallel across them:
  # the drive uses software GL and saturates the cores it is given, so two
  # scenes in one runner make both slower rather than the pair faster.
  #
  # A production build, and no `--preview`. What a published scene owes is what
  # a reader actually receives, and the preview build is a different bundle.
  anatomy:
    name: anatomy drive (${{ matrix.scene }})
    needs: published-scenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # One scene failing is a finding about that scene. The other three still
      # have to report, or a single break hides everything behind it.
      fail-fast: false
      matrix:
        scene: ${{ fromJSON(needs.published-scenes.outputs.scenes) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:anatomy -- --scene ${{ matrix.scene }}

  # Disease and patient need the preview grants, and the patient walk needs an
  # account configuration as well: it writes a session into `localStorage`, and
  # a build with no Supabase configured has no account layer to read it, so the
  # walk would drive a signed-out page and say the guide was withheld. Same
  # stub values `final-browser-validation.yml` uses, and for the same reason —
  # the host does not resolve and every request is answered in the browser.
  #
  # Built into `dist` rather than `dist-preview`: `check-disease-interaction.mjs`
  # resolves its own build directory and does not take a flag for it.
  disease:
    name: disease drive
    needs: published-scenes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate identity
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with preview grants and a stub account configuration
        env:
          VITE_ALLOW_PREVIEW: '1'
          VITE_SUPABASE_URL: https://stub.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: stub-publishable-key
        run: npm run build
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      # The first argument is the screenshot directory, not a scene. Passing a
      # slug there silently turns it into a directory name and drops that scene
      # from the drive, which is what the script's own usage note used to say.
      # Also the video export, on the scenes that carry a 15-second sequence:
      # consent, record, and play the written file back in the browser. That
      # adds about 25 seconds per such scene, and the artefact below carries
      # the file and the frame pulled out of it, so a reviewer can watch what
      # a reader would have downloaded.
      #
      # The named scenes plus every published one the anatomy drive cannot
      # cover. The second half is what stops a published scene from being
      # driven by nothing at all when the beta opens something that is not
      # anatomy — the caller does not have to remember to add it here.
      - name: Drive baseline to disease and back, and export the sequence
        env:
          DISEASE_SCENES: ${{ inputs.disease_scenes }}
          PUBLISHED_MECHANISM_SCENES: ${{ needs.published-scenes.outputs.mechanism }}
        run: npm run verify:disease -- disease-shots ${DISEASE_SCENES} ${PUBLISHED_MECHANISM_SCENES}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: disease-shots-attempt-${{ github.run_attempt }}
          path: disease-shots/
          if-no-files-found: ignore
          retention-days: 3

  patient:
    name: patient explanation walk (${{ inputs.patient_scene }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate candidate identity
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: |
          [[ "${COMMIT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build with preview grants and a stub account configuration
        env:
          VITE_ALLOW_PREVIEW: '1'
          VITE_SUPABASE_URL: https://stub.invalid
          VITE_SUPABASE_PUBLISHABLE_KEY: stub-publishable-key
        run: npm run build
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:patient -- --preview --scene ${{ inputs.patient_scene }}
