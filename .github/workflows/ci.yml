name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust-contracts:
    name: trust / ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - clinical-review-presentation
          - clinical-reviews
          - professional-access-review
          - commerce-readiness
          - explorer-search
          - access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test "tests/${{ matrix.test }}.test.js"

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run revisions:check
      - run: npm run build
      - run: npm run budget
      - run: npm run verify:site

  # Chromium only, headless, on a runner — deliberately a separate job.
  #
  # It downloads a browser, so it must not sit in front of `npm test`: the
  # normal feedback loop stays a plain `node --test` run. And it is honest
  # about its own reach — the manual half of the device pass is listed in
  # `docs/accessibility.md` and reprinted by the script itself.
  viewport-matrix:
    name: viewport matrix
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Not a devDependency on purpose: a browser automation stack is a large
      # thing to make every contributor download to run the unit tests.
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:ui -- --json viewport-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-report
          path: viewport-report.json
          if-no-files-found: ignore
