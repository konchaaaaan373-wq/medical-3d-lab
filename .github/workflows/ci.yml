name: CI

"on":
  pull_request:
  push:
    branches: [main]

# Validation runs only. Deployment and production monitoring use different
# workflows/services and are intentionally outside this cancellation group.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Keep this job name stable: it may already be a required check.
  # `npm test` runs tests/*.test.js, including the six former trust matrix
  # entries, so those tests remain present without six extra installs/runners.
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history, for `tests/asset-provenance.test.js`. It asks where each
      # adopted binary entered the default branch, which a shallow clone cannot
      # answer — and answering it wrongly is not hypothetical: read on a shallow
      # clone, the boundary commit looks like it added every file in its tree,
      # which is how the brain atlas came to be reported as having an
      # unreachable provenance commit when its record was right all along. The
      # test refuses to run shallow rather than passing vacuously, so without
      # this line it fails here instead of lying.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The Node version is `.nvmrc`'s, in every workflow, because it is also
      # the file Netlify builds with — and the build's Node is the runtime its
      # functions get, the hourly `scheduled-billing-reconcile` included. Until
      # 2026-10-22 these steps said `22` twelve times and nothing said what
      # Netlify used. `check-latest` takes the newest patch rather than whatever
      # the runner image cached, so a security release reaches CI when it
      # reaches the deploy. `tests/node-runtime.test.js` keeps it this way.
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run revisions:check
      - run: npm run build
      - run: npm run budget
      - run: npm run verify:site
      - run: npm run cards:check
      - run: npm run type-floor
      # The tab icon and the web manifest are written from one drawing
      # (`src/components/brandIcon.js`); this fails when either drifted from it.
      - run: npm run icons -- --check
      # The MRI atlas's files, rebuilt from the pinned inputs and compared with
      # what is committed (decompressed bytes). It downloads the inputs from
      # TemplateFlow and verifies their SHA-256 first, so a changed upstream
      # file is a red build here and not a silently different brain. The side
      # of every label (left/right) is measured during the build; a mirrored
      # atlas stops it.
      - run: npm run mri:build -- --fetch --check

  # A real browser, on every pull request. Until 2026-09-15 this was kept out of
  # ordinary pushes because the repository was private and Actions minutes were
  # the constraint (F-100). It is public now, so the constraint is gone and the
  # question became the one it should always have been: is the wall clock worth
  # it? Four defects have reached `main` with `npm test` entirely green and a
  # browser check the only thing that found them — the `billingNotice` TDZ, a
  # dialog's focus trap, the zoom pivot, and `walkTabOrder` reporting a large
  # page as a trap. Two of those are this check's. So, for this one check: yes.
  #
  # Chromium only, and `verify:ui` only. `verify:auth`, `verify:anatomy`,
  # the full disease matrix and `verify:patient`, and Firefox and WebKit, stay at
  # candidate time in `final-browser-validation.yml`. F-112 records where that
  # line is drawn and what would move it.
  #
  # Its own job rather than another step in `test-and-build`: it takes about
  # four minutes against that job's one, and a failing unit test should not have
  # to wait behind a browser download to be reported.
  verify-ui:
    name: viewport matrix (chromium)
    runs-on: ubuntu-latest
    # 20 → 30 (2026-09-27): on main this job already ran ~18.5 of its 20
    # minutes, and #162 added a surface to the matrix (`#/patient`) and made
    # `verify:gated` actually open the patient explanation. It was cancelled in
    # the video export — every step before it green — rather than failing.
    # 30 → 40 (2026-09-29): on main it now runs ~29 of 30 minutes (run 816),
    # and #165 was cancelled at 30.3 in the same step, the DPR 2 video export
    # of copd, with every earlier step green. Nothing in #165 is in that step;
    # the job is simply at its limit. How to make it shorter is F-236.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:ui -- --json viewport-report-chromium.json
      # The same browser, already installed, for the paths a stand-in `window`
      # can only pretend to have: a Back press that never left the document, and
      # a reload that was asked for and never arrived. Both were unit-tested and
      # undriven (F-114) through two attempts at this feature, and the second
      # attempt spent four review rounds on exactly them. About 40 seconds, most
      # of it waiting out a 12-second backstop on purpose.
      - run: npm run verify:departure
      # The MRI atlas, read from the page: which side of the screen is the
      # patient's left, which label is under the crosshair, and that choosing in
      # 3D moves the planes and choosing on a plane lights the 3D. A symmetric
      # standard brain looks identical mirrored, so none of this can be judged
      # from a screenshot (L-185). It runs on the production build because the
      # atlas is published; if the release ever withholds it, this step must
      # move to the preview build rather than be deleted.
      - run: npm run verify:mri
      # The paid surfaces, which nobody could look at until now. A second build,
      # because the entitlements are granted by `VITE_ALLOW_PREVIEW=1` and a
      # production bundle has no such capability — see
      # `src/access/previewGrants.js`. What it guards is the sentences saying
      # what a model may be used for: one of them shipped at 9.5px on the
      # education guide, and it was invisible because the surface was.
      - run: npm run build:preview
      - run: npm run verify:gated -- --dist dist-preview
      # F-173: the existing preview build/browser also measures the real
      # composer's render targets at DPR 2 and decodes one exported sequence.
      - name: Video export at DPR 2
        run: npm run verify:disease -- --dist dist-preview --dpr 2 disease-video-dpr2 copd
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: disease-video-dpr2
          path: disease-video-dpr2/
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: viewport-report-chromium
          path: viewport-report-chromium.json
          if-no-files-found: ignore
          retention-days: 3
