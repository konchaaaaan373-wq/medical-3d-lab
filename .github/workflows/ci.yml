name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  trust-contracts:
    name: trust / ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - clinical-review-presentation
          - clinical-reviews
          - professional-access-review
          - commerce-readiness
          - explorer-search
          - access
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test "tests/${{ matrix.test }}.test.js"

  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run revisions:check
      - run: npm run build
      - run: npm run budget
      - run: npm run verify:site
      # No browser: it compares what each committed card was asked to say,
      # not the pixels, which depend on the fonts of whichever machine drew it.
      - run: npm run cards:check

  # Chromium only, headless, on a runner — deliberately a separate job.
  #
  # It downloads a browser, so it must not sit in front of `npm test`: the
  # normal feedback loop stays a plain `node --test` run. And it is honest
  # about its own reach — the manual half of the device pass is listed in
  # `docs/accessibility.md` and reprinted by the script itself.
  viewport-matrix:
    name: viewport matrix (${{ matrix.engine }})
    runs-on: ubuntu-latest
    # 54 combinations per engine, and Firefox and WebKit are slower to start
    # than Chromium. A timeout here reads as a broken job rather than what it
    # is, so there is room for the two new engines to be slow.
    timeout-minutes: 30
    strategy:
      # One engine failing is a finding about that engine, not a reason to stop
      # measuring the others.
      fail-fast: false
      matrix:
        # WebKit is the engine Safari is built on. It is not Safari, and it is
        # not iOS — what it catches is the layout and CSS half (dvh, env(),
        # mask-image, :has()), which is where this product's own chrome lives.
        # The rest of the device pass stays manual and is listed in
        # `docs/accessibility.md`.
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Not a devDependency on purpose: a browser automation stack is a large
      # thing to make every contributor download to run the unit tests.
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps ${{ matrix.engine }}
      - name: Verify viewport matrix
        env:
          VIEWPORT_EVIDENCE_DIR: ${{ matrix.engine == 'chromium' && 'viewport-evidence' || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run verify:ui -- --engine ${{ matrix.engine }} --json viewport-report-${{ matrix.engine }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: viewport-report-${{ matrix.engine }}
          path: viewport-report-${{ matrix.engine }}.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always() && matrix.engine == 'chromium'
        with:
          name: b1-ui-evidence-chromium-attempt-${{ github.run_attempt }}
          path: viewport-evidence/
          if-no-files-found: warn
          retention-days: 7

  # Temporary, bounded B1 diagnostic. It uses the existing viewport runner and
  # records the exact desktop Landing-to-Explorer lifecycle plus a fresh-context
  # Explorer control. The regular three-engine matrix above remains unchanged.
  webkit-lifecycle-diagnostic:
    name: WebKit B1 lifecycle diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm i --no-save playwright@1.62.1
      - run: npx playwright install --with-deps webkit
      - name: Reproduce desktop argues Landing to Explorer and direct Explorer
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          for attempt in 1 2 3; do
            sequence_dir="webkit-lifecycle/sequence-${attempt}"
            direct_dir="webkit-lifecycle/direct-${attempt}"
            mkdir -p "${sequence_dir}" "${direct_dir}"

            npm run verify:ui -- \
              --engine webkit \
              --viewport desktop-1280 \
              --surface landing \
              --surface explorer \
              --json "${sequence_dir}/report.json" \
              --diagnostics-dir "${sequence_dir}"
            echo "$?" > "${sequence_dir}/exit-code.txt"

            npm run verify:ui -- \
              --engine webkit \
              --viewport desktop-1280 \
              --surface explorer \
              --json "${direct_dir}/report.json" \
              --diagnostics-dir "${direct_dir}" \
              --diagnostics-wait-detail
            echo "$?" > "${direct_dir}/exit-code.txt"
          done
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-b1-lifecycle-diagnostic-attempt-${{ github.run_attempt }}
          path: webkit-lifecycle/
          if-no-files-found: warn
          retention-days: 7
