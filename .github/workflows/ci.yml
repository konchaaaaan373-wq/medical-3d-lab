name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  access-imports:
    name: Import · ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        module:
          - src/access/policy.js
          - src/access/features.js
          - src/catalog/scenes.js
          - src/data/patientGuides.js
          - src/data/educationGuides.js
          - netlify/lib/billing.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node -e "import('./${{ matrix.module }}')"

  access-categories:
    name: Access · ${{ matrix.category }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - category: entitlement policy
            pattern: '^access:'
          - category: product capabilities
            pattern: '^product:'
          - category: billing integrity
            pattern: '^billing:'
          - category: patient mode
            pattern: '^patient mode:'
          - category: education mode
            pattern: '^education mode:'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-name-pattern="${{ matrix.pattern }}" tests/access.test.js

  product-unit-tests:
    name: Product unit · ${{ matrix.test }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        test:
          - tests/pricing.test.js
          - tests/subscription-view.test.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test ${{ matrix.test }}

  test-and-build:
    name: Full test + build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
