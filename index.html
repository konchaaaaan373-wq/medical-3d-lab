<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch zoom stays available. `user-scalable=no` was here to stop the
         browser zooming during an orbit gesture, but it took the ability away
         from every reading surface too — the landing page, the catalogue, the
         terms, the evidence records — which is a WCAG 1.4.4 failure for the
         sake of one canvas. The canvas declares `touch-action: none` in
         base.css, which suppresses browser gestures exactly where they conflict
         and nowhere else. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Replaced at start-up with the scene or the explorer; this is what a
         crawler or a JS-less browser sees. Japanese is the product default;
         LanguageToggle changes `lang` together with the visible copy. -->
    <title>Medical 3D Lab — 3D medical models</title>
    <meta
      name="description"
      content="Web-based 3D medical models for anatomy, physiology and disease, developed for clear patient explanation and medical education."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='%2338e1ef'/></svg>" />
  </head>
  <body>
    <!-- The renderer canvas is appended here; all UI lives in #ui as an overlay. -->
    <div id="stage"></div>
    <div id="ui"></div>

    <!--
      The wait, painted by the parser rather than by the bundle.

      Opening a model is a document load, and there was a gap between the new
      document committing and `main.js` running far enough to create a loading
      element. For the length of that gap the reader looked at an empty page —
      measured, and caught in a screenshot 400 ms into a brain → heart switch:
      the build marker was painted and nothing else was. That blank is what
      "the app disappears when I change pages" was describing, and no amount of
      work inside the bundle can close it, because the bundle is what is being
      waited for.

      So this is markup, and the decision below is nine lines of inline script
      that run before the first paint. It costs no request and no module.

      `DOCUMENT_ROUTE_SLUGS` in `src/app/router.js` is the same list, and
      `tests/boot-veil.test.js` fails if the two disagree — the failure mode
      otherwise is a "loading a 3D model" veil flashing over the terms page.
    -->
    <div id="boot-veil" class="loading" role="status" hidden>
      <span id="boot-veil-label"></span>
      <span class="loading-bar"></span>
    </div>
    <script>
      (function () {
        var DOCUMENT_ROUTES = ['', 'commerce', 'evidence', 'experimental', 'explore', 'home', 'lab', 'organs', 'pathology', 'privacy', 'support', 'terms', 'trust'];
        var slug = String(location.hash || '').replace(/^#\/?/, '').split('?')[0].trim();
        if (DOCUMENT_ROUTES.indexOf(slug) !== -1) return;
        var veil = document.getElementById('boot-veil');
        var label = document.getElementById('boot-veil-label');
        var ja = String(document.documentElement.lang || 'ja').indexOf('en') !== 0;
        // Deliberately generic. The organ's name needs the catalogue, which is
        // in the bundle; `main.js` replaces this the moment it knows, and the
        // departing document's veil already said the name.
        label.textContent = ja ? '3Dモデルを読み込んでいます' : 'Loading 3D model';
        veil.hidden = false;
      })();
    </script>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
