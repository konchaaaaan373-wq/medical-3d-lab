<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Pinch zoom stays available. `user-scalable=no` was here to stop the
         browser zooming during an orbit gesture, but it took the ability away
         from every reading surface too — the landing page, the catalogue, the
         terms, the evidence records — which is a WCAG 1.4.4 failure for the
         sake of one canvas. The canvas declares `touch-action: none` in
         base.css, which suppresses browser gestures exactly where they conflict
         and nowhere else. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Replaced at start-up with the scene or the explorer; this is what a
         crawler or a JS-less browser sees. -->
    <title>medical-3d-lab — interactive 3D physiology</title>
    <meta
      name="description"
      content="Interactive 3D models of dynamic physiology and disease, for medical education. Simplified educational models across the body — heart failure haemodynamics, amyloid-beta aggregation, and prototype scenes for the lungs, gut, liver, kidneys, endocrine glands and more."
    />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='11' fill='%2338e1ef'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- The renderer canvas is appended here; all UI lives in #ui as an overlay. -->
    <div id="stage"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
