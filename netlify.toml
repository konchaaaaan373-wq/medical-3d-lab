# Deploy configuration.
#
# Production keeps only the canonical origin and scheduled billing repair.
# Everything browser-QA-related below is scoped to Deploy Previews and is
# temporary for PR #55.

[build.environment]
  VITE_SITE_URL = "https://med-3d-lab.necofindjob.com"

# A preview deploy is not the site. It has no canonical production URL and, for
# this review branch, compiles the existing preview-only release unlock so the
# five publication candidates can be exercised without changing production.
[context.deploy-preview]
  command = "npm run build && node scripts/run-netlify-browser-audit.mjs"

[context.deploy-preview.environment]
  VITE_SITE_URL = ""
  VITE_ALLOW_PREVIEW = "1"

[context.branch-deploy.environment]
  VITE_SITE_URL = ""

# Real Chromium for the browser-first audit. This plugin exists only in deploy
# previews; production does not install or run it.
[[context.deploy-preview.plugins]]
  package = "netlify-plugin-chromium"
  [context.deploy-preview.plugins.inputs]
    setChromePathInEnv = true
    failBuildOnError = false

# Read dist/browser-audit/report.json after the build command has driven the
# scenes and expose its exact per-scene result in Netlify's Deploy Summary.
[[context.deploy-preview.plugins]]
  package = "./plugins/netlify-browser-audit-status"

[functions."scheduled-billing-reconcile"]
  schedule = "17 * * * *"