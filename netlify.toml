# Deploy configuration.
#
# Production keeps only the canonical origin and scheduled billing repair.
# Everything browser-QA-related below is scoped to Deploy Previews and is
# temporary for PR #55.

[build.environment]
  VITE_SITE_URL = "https://med-3d-lab.necofindjob.com"

# Final publication-candidate pass. The broader cross-system representative
# audit is green, so return to the five release candidates for the merge-facing
# browser evidence. Production release decisions remain unchanged.
[context.deploy-preview]
  command = "npm run build && node scripts/run-netlify-browser-audit.mjs"

[context.deploy-preview.environment]
  VITE_SITE_URL = ""
  VITE_ALLOW_PREVIEW = "1"
  BROWSER_AUDIT_SET = "candidates"

[context.branch-deploy.environment]
  VITE_SITE_URL = ""

[[context.deploy-preview.plugins]]
  package = "netlify-plugin-chromium"
  [context.deploy-preview.plugins.inputs]
    setChromePathInEnv = true
    failBuildOnError = false

[[context.deploy-preview.plugins]]
  package = "./plugins/netlify-browser-audit-status"

[functions."scheduled-billing-reconcile"]
  schedule = "17 * * * *"
