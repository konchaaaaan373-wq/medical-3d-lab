# Deploy configuration.
#
# Two things live here, and nothing else in production: the origin the site is
# published at, and the schedule of the one function that has to run whether or
# not anybody visits. The deploy-preview override below is temporary QA plumbing
# for the browser-first release-candidate pass; production is unchanged.

[build.environment]
  VITE_SITE_URL = "https://med-3d-lab.necofindjob.com"

# A preview deploy is not the site.
#
# Given the production origin it would tell a crawler that the preview *is*
# production; given its own it would advertise an address that disappears when
# the branch does. So it declares neither. For this review branch only, preview
# builds also compile the existing preview capability and run real Chromium
# against the five release candidates. The screenshots are written under dist/
# so the deploy itself is the review packet. The publication manifest and the
# production build remain untouched.
[context.deploy-preview]
  command = "npm i --no-save --package-lock=false playwright-core && npm test && npm run build && node -e \"const fs=require('fs');const p='scripts/audit-release-candidates.mjs';let s=fs.readFileSync(p,'utf8');s=s.replace('chromium.launch({ headless: !headed })','chromium.launch({ headless: !headed, executablePath: process.env.CHROME_PATH })');fs.writeFileSync(p,s)\" && node scripts/audit-release-candidates.mjs --dist dist --out dist/browser-audit"

[context.deploy-preview.environment]
  VITE_SITE_URL = ""
  VITE_ALLOW_PREVIEW = "1"

[context.branch-deploy.environment]
  VITE_SITE_URL = ""

# Netlify's Chromium integration installs a build-time browser and exports its
# executable as CHROME_PATH. Playwright-core provides only the automation API;
# the deploy does not try to apt-install browser dependencies or download a
# second browser. This block is temporary and will be removed before merge.
[[plugins]]
  package = "netlify-plugin-chromium"
  [plugins.inputs]
    setChromePathInEnv = true
    failBuildOnError = true

[functions."scheduled-billing-reconcile"]
  # Keep the production repair schedule in Netlify's deployment manifest as
  # well as the function export. The manifest is the authoritative fallback
  # when build-time function metadata discovery changes.
  schedule = "17 * * * *"